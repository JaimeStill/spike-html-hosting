# Project kind: this spike builds the org stand-in's Pages site over the web stack's layers,
# checked by `mise run check`. Its goals live in the coordinator's roadmap
# (standards-lab/context/roadmap.toml). `mise run currency` reports every mise tool pinned behind
# its latest; the layers task extends it to the package dependencies. No gate.
[project]
kind = "code"
check = "mise run check"
currency = "mise run currency"

# Remote platform, the commands that publish and merge a finished branch, and the wait for the
# push run on main: the Pages deploy, which the layers task adds, so a site's merge isn't done
# until its deploy passes.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr checks --watch && gh pr merge --merge --delete-branch"
ci = '''
sha=$(git rev-parse HEAD)
for _ in $(seq 30); do
  runs=$(gh run list --commit "$sha" --event push --json databaseId --jq '.[].databaseId')
  [ -n "$runs" ] && break || sleep 10
done
[ -n "$runs" ] || exit 1
for run in $runs; do gh run watch --exit-status "$run" || exit 1; done
'''
