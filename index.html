<!doctype html>
<!-- The org stand-in's GitHub Pages site, its index, the root's hand page: the foundation's full
     page entry and its registrations, every built-in profile, so the theme menu offers each, its
     preferences module, and its keys module, render-blocking, as the build makes every module
     script one entry; the SDK's site.css by the package's name, after the entry; a button that
     opens the theme menu, which keys.js clicks on T; the components' site nav, its module
     render-blocking too, at the header's start; the Help button, before the Theme button, which
     opens the keys help dialog by the invoker command show-modal, keys.js clicking it on ? and
     filling the dialog's [data-keys-list] as it opens with the page's bindings and the reader's
     switch that turns the character keys off (WCAG 2.1.4); and its own main content. The Help
     and Theme buttons and the dialog's Close are named by their aria-label, the visible text before
     the key hint, which is a kbd alone and aria-hidden; the dialog lists that name.
     No Markdown fills it: the copied trees' rendered pages fill page.html, so the index loads none
     of the components' other modules and has no Pages button or drawer.
     Adapted from spike-html-hosting (cb0511c): index.html, its title and text this site's, and its
     page a shell.
     Adapted from spike-html-hosting (fba414c): index.html, its full page entry, its keys module,
     and the Theme button that keys.js clicks on T.
     Adapted from spike-html-hosting-architecture (27d70e1): index.html, its title the site's
     repository and its stylesheet the SDK's.
     Adapted from spike-html-hosting-sdk (v0.3.1): template/index.html, its title the org
     stand-in's and its main element the root's own content, not a shell to fill, without the Pages
     button, its drawer, and the components' other modules. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The org stand-in</title>
    <link rel="stylesheet" href="@jaimestill/spike-html-apps-foundation/page-full.css" />
    <link rel="stylesheet" href="@jaimestill/spike-html-hosting-sdk/site.css" />
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/register-full.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/preferences.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/keys.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/site-nav.js"></script>
  </head>
  <body>
    <header>
      <sl-site-nav></sl-site-nav>
      <button
        type="button"
        commandfor="help"
        command="show-modal"
        aria-label="Help"
        data-keys="?"
      >
        Help <span aria-hidden="true"><kbd>?</kbd></span>
      </button>
      <button
        type="button"
        commandfor="theme"
        command="--open"
        aria-label="Theme"
        data-keys="t"
      >
        Theme <span aria-hidden="true"><kbd>T</kbd></span>
      </button>
    </header>
    <main>
      <h1>The org stand-in</h1>
      <p>
        This site is the org stand-in of spike-html-hosting, a spike on hosting GitHub Pages sites
        and persistent artifacts as native web. Its content arrives in later tasks.
      </p>
    </main>
    <sl-theme-menu id="theme"></sl-theme-menu>
    <dialog id="help" aria-labelledby="help-title">
      <h2 id="help-title">Keyboard shortcuts</h2>
      <div data-keys-list></div>
      <footer>
        <button
          type="button"
          commandfor="help"
          command="close"
          aria-label="Close"
          data-keys="?"
        >
          Close <span aria-hidden="true"><kbd>?</kbd></span>
        </button>
      </footer>
    </dialog>
  </body>
</html>
