<!doctype html>
<!-- The org stand-in's GitHub Pages site: the foundation's full page entry and its registrations,
     every built-in profile, so the theme menu offers each, its preferences module, and keys.js,
     render-blocking as the foundation's README "Use" section loads them; the site's layout,
     site.css, after the entry; and a button that opens the theme menu, which keys.js clicks on T. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The org stand-in</title>
    <link rel="stylesheet" href="@jaimestill/spike-html-apps-foundation/page-full.css" />
    <link rel="stylesheet" href="/site.css" />
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/register-full.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/preferences.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/keys.js"></script>
  </head>
  <body>
    <main>
      <h1>The org stand-in</h1>
      <p>
        This site is the org stand-in of spike-html-hosting, a spike on hosting GitHub Pages sites
        and persistent artifacts as native web. Its content arrives in later tasks.
      </p>
      <p><button type="button" commandfor="theme" command="--open" data-keys="t">Theme</button></p>
    </main>
    <sl-theme-menu id="theme"></sl-theme-menu>
  </body>
</html>
